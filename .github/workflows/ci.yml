name: CI

on:
  push:
  pull_request:

jobs:
  build:
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build lang.slnx --configuration Release --nologo
      - run: dotnet run --project src/Lang --configuration Release -- test
      - name: Ensure Linux NativeAOT prerequisites
        if: runner.os == 'Linux'
        run: |
          if ! command -v clang >/dev/null 2>&1 || ! dpkg-query -W -f='${Status}' zlib1g-dev 2>/dev/null | grep -q 'install ok installed'; then
            sudo apt-get update
            sudo apt-get install -y clang zlib1g-dev
          fi
      - name: Run integration tests, including NativeAOT publish and execution
        run: dotnet run --project tests/Lang.IntegrationTests --configuration Release --no-build
        timeout-minutes: 20
      - run: dotnet run --project src/Lang --configuration Release --no-build -- run examples/pure/src/main.lang
      - run: dotnet run --project src/Lang --configuration Release --no-build -- run examples/types/src/main.lang
      - run: dotnet run --project src/Lang --configuration Release --no-build -- run examples/structs/src/main.lang
