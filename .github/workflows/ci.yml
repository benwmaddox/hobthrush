name: CI

on:
  push:
  pull_request:

jobs:
  build:
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build hobthrush.slnx --configuration Release --nologo
      - name: Run agent outcome evaluations
        run: >-
          dotnet run --project tests/Hob.OutcomeEval/Hob.OutcomeEval.csproj --configuration Release --no-build --
          --compiler src/Hob/bin/Release/net10.0/hob.dll
          --results artifacts/outcome-evals
          --agent-model reference-fixture
          --agent-revision local-checkout
          --agent-tool outcome-eval
          --verify-seeds
      - name: Upload outcome evaluation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: outcome-evals-${{ runner.os }}
          path: artifacts/outcome-evals/
          if-no-files-found: warn
      - run: dotnet run --project src/Hob --configuration Release -- test
      - name: Ensure Linux NativeAOT prerequisites
        if: runner.os == 'Linux'
        run: |
          if ! command -v clang >/dev/null 2>&1 || ! dpkg-query -W -f='${Status}' zlib1g-dev 2>/dev/null | grep -q 'install ok installed'; then
            sudo apt-get update
            sudo apt-get install -y clang zlib1g-dev
          fi
      - name: Run integration tests, including NativeAOT publish and execution
        run: dotnet run --project tests/Hob.IntegrationTests --configuration Release --no-build
        timeout-minutes: 25
      - run: dotnet run --project src/Hob --configuration Release --no-build -- run examples/pure/src/main.hob
      - run: dotnet run --project src/Hob --configuration Release --no-build -- run examples/types/src/main.hob
      - run: dotnet run --project src/Hob --configuration Release --no-build -- run examples/structs/src/main.hob
      - run: dotnet run --project src/Hob --configuration Release --no-build -- check examples/library-package
      - run: dotnet run --project src/Hob --configuration Release --no-build -- run examples/library-package
